<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">

</head>

<body class="{{BODY_CLASS}}">
  <div class="page">
    <header class="desktop-header">
      <a href="/" class="logo"><span class="logo-mark">PR</span><span class="logo-copy">PC
          Rental<small>设备租赁控制台</small></span></a>
      <span class="asset-tag mono">ASSET OPS / MEL</span>
      <nav class="main-nav">{{TOP_NAV}}</nav>
      <div class="user-block">{{USER_BLOCK}}</div>
    </header>
    <header class="mobile-header">
      <a href="/" class="logo"><span class="logo-mark">PR</span><span class="logo-copy">PC Rental</span></a>
      <span class="mobile-header__label">{{MOBILE_LABEL}}</span>
      <div class="user-block">{{MOBILE_USER_BLOCK}}</div>
    </header>
    <div class="container">
      {{SIDEBAR}}
      <main class="content">{{CONTENT}}</main>
    </div>
    <nav class="mobile-bottom-nav" aria-label="移动端导航">{{MOBILE_NAV}}</nav>
    {{FOOTER}}
  </div>
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown/dist/turndown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
    window.createRichTextEditor = function (selector, options) {
      if (window.Quill) {
        try {
          return new window.Quill(selector, options);
        } catch (error) {
          console.error('Quill initialization failed, falling back to contentEditable:', error);
        }
      }
      const root = document.querySelector(selector);
      if (!root) throw new Error('Rich text editor element not found: ' + selector);
      root.contentEditable = 'true';
      root.setAttribute('role', 'textbox');
      root.setAttribute('aria-multiline', 'true');
      root.classList.add('rich-text-fallback');
      const toolbar = document.createElement('div');
      toolbar.className = 'rich-text-fallback-toolbar';
      const commands = [
        ['正文', 'formatBlock', 'p'], ['H1', 'formatBlock', 'h1'], ['H2', 'formatBlock', 'h2'],
        ['B', 'bold'], ['I', 'italic'], ['U', 'underline'], ['S', 'strike'],
        ['1.', 'insertOrderedList'], ['•', 'insertUnorderedList'], ['“”', 'formatBlock', 'blockquote'],
        ['代码', 'formatBlock', 'pre'], ['颜色', 'foreColor'], ['背景', 'hiliteColor'],
        ['左', 'justifyLeft'], ['中', 'justifyCenter'], ['右', 'justifyRight'], ['两端', 'justifyFull'],
        ['链接', 'createLink'], ['清除', 'removeFormat']
      ];
      commands.forEach(function (item) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = item[0];
        button.addEventListener('mousedown', function (event) {
          event.preventDefault();
          root.focus();
          let value = item[2] || null;
          if (item[1] === 'createLink') {
            value = window.prompt('请输入链接地址（https://）');
            if (!value) return;
          }
          document.execCommand(item[1], false, value);
        });
        toolbar.appendChild(button);
      });
      root.parentNode.insertBefore(toolbar, root);
      return { root: root };
    };

    window.markdownToHtml = function (markdown) {
      if (window.marked && typeof window.marked.parse === 'function') {
        return window.marked.parse(String(markdown || ''), { breaks: true, gfm: true });
      }
      if (typeof window.marked === 'function') return window.marked(String(markdown || ''));
      return String(markdown || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>')
        .replace(/^/, '<p>').replace(/$/, '</p>');
    };

    window.htmlToMarkdown = function (html) {
      if (window.TurndownService) {
        try {
          return new window.TurndownService().turndown(String(html || ''));
        } catch (error) {
          return String(html || '').replace(/<[^>]+>/g, '');
        }
      }
      return String(html || '').replace(/<[^>]+>/g, '').trim();
    };

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('table:not(.official-document__table)').forEach(function (table) {
        const labels = Array.from(table.querySelectorAll('thead th')).map(function (header) { return header.textContent.trim(); });
        table.querySelectorAll('tbody tr').forEach(function (row) {
          Array.from(row.children).forEach(function (cell, index) {
            if (cell instanceof HTMLElement) cell.dataset.label = labels[index] || '';
          });
        });
      });
    });

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('textarea.markdown-editor').forEach(function (editor) {
        if (editor.dataset.markdownReady === 'true') return;
        editor.dataset.markdownReady = 'true';
        editor.removeAttribute('disabled');
        editor.removeAttribute('readonly');
        editor.style.display = 'block';
        editor.style.pointerEvents = 'auto';
        editor.style.userSelect = 'text';
        editor.style.visibility = 'visible';
        editor.style.opacity = '1';
        editor.setAttribute('spellcheck', 'false');
        const toolbar = document.createElement('div');
        toolbar.className = 'markdown-editor-toolbar';
        [['标题', '# '], ['粗体', '**文字**'], ['斜体', '*文字*'], ['列表', '- 项目'], ['分隔线', '\n---\n']].forEach(function (item) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = item[0];
          button.addEventListener('click', function () {
            const start = editor.selectionStart || 0;
            const end = editor.selectionEnd || start;
            const selected = editor.value.slice(start, end) || item[1];
            editor.setRangeText(item[0] === '标题' ? '# ' + selected : item[1].includes('文字') ? item[1].replace('文字', selected) : item[1], start, end, 'end');
            editor.dispatchEvent(new Event('input', { bubbles: true }));
            editor.focus();
          });
          toolbar.appendChild(button);
        });
        editor.parentNode.insertBefore(toolbar, editor);
      });
    });

    document.addEventListener('DOMContentLoaded', function () {
      if (!window.gsap) return;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const gsap = window.gsap;
      if (window.ScrollTrigger) gsap.registerPlugin(window.ScrollTrigger);
      const root = document.querySelector('.content') || document.body;
      const pageHeader = root.querySelector('.page-header, .entity-header, .signing-page-header');
      const panels = Array.from(root.querySelectorAll('.panel, .card')).filter((item) => !item.closest('.a4-document, .official-document'));
      const rows = Array.from(root.querySelectorAll('tbody tr')).slice(0, 30);
      const buttons = root.querySelectorAll('.button, .link-button');

      if (reduceMotion) {
        gsap.set([pageHeader, ...panels, ...rows], { clearProps: 'all' });
        return;
      }

      gsap.set([pageHeader, ...panels, ...rows].filter(Boolean), { autoAlpha: 0, y: 14 });
      const intro = gsap.timeline({ defaults: { ease: 'power3.out' } });
      if (pageHeader) intro.to(pageHeader, { autoAlpha: 1, y: 0, duration: .55 });
      if (panels.length) intro.to(panels.slice(0, 3), { autoAlpha: 1, y: 0, duration: .45, stagger: .07 }, '-=.28');
      if (rows.length) intro.to(rows, { autoAlpha: 1, y: 0, duration: .28, stagger: .025 }, '-=.18');

      if (window.ScrollTrigger) {
        root.querySelectorAll('.panel, .card, .record-panel, .official-document').forEach((element) => {
          if (element === pageHeader || element.closest('.a4-document')) return;
          gsap.fromTo(element, { autoAlpha: 0, y: 18 }, {
            autoAlpha: 1, y: 0, duration: .55, ease: 'power3.out',
            scrollTrigger: { trigger: element, start: 'top 88%', once: true }
          });
        });
      }

      const mobileMotion = gsap.matchMedia();
      mobileMotion.add('(max-width: 640px)', () => {
        const mobileHeader = document.querySelector('.mobile-header');
        const bottomNav = document.querySelector('.mobile-bottom-nav');
        const mobileCards = root.querySelectorAll('.panel, .card, tbody tr');
        const mobileTimeline = gsap.timeline({ defaults: { ease: 'power3.out' } });
        if (mobileHeader) mobileTimeline.fromTo(mobileHeader, { y: -18, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .42 });
        if (bottomNav) mobileTimeline.fromTo(bottomNav, { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .42 }, '-=.18');
        if (mobileCards.length) mobileTimeline.fromTo(mobileCards, { y: 14, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .32, stagger: .035 }, '-=.18');
        return () => mobileTimeline.kill();
      });

      const desktopMotion = gsap.matchMedia();
      desktopMotion.add('(min-width: 641px)', () => {
        const desktopHeader = document.querySelector('.desktop-header');
        const sidebar = document.querySelector('.sidebar');
        const navLinks = document.querySelectorAll('.desktop-header .main-nav a, .sidebar-section a');
        const desktopCards = root.querySelectorAll('.panel, .card, .stats-card, .metric-card');
        const statusBadges = root.querySelectorAll('.badge-success, .badge-warning, .badge-info, .badge-primary');
        const timeline = gsap.timeline({ defaults: { ease: 'power3.out' } });
        if (desktopHeader) timeline.fromTo(desktopHeader, { y: -16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .48 });
        if (sidebar) timeline.fromTo(sidebar, { x: -18, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: .5 }, '-=.28');
        if (navLinks.length) timeline.fromTo(navLinks, { y: -8, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .28, stagger: .035 }, '-=.25');
        if (desktopCards.length) timeline.fromTo(desktopCards, { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .38, stagger: .045 }, '-=.18');
        statusBadges.forEach((badge) => {
          gsap.to(badge, { boxShadow: '0 0 0 5px rgba(36, 99, 235, .08)', duration: 1.8, repeat: -1, yoyo: true, ease: 'sine.inOut' });
        });
        desktopCards.forEach((card) => {
          card.addEventListener('mouseenter', () => gsap.to(card, { y: -3, duration: .24, ease: 'power2.out', overwrite: 'auto' }));
          card.addEventListener('mouseleave', () => gsap.to(card, { y: 0, duration: .28, ease: 'power2.out', overwrite: 'auto' }));
        });
        return () => { timeline.kill(); gsap.killTweensOf(statusBadges); };
      });

      buttons.forEach((button) => {
        button.addEventListener('pointerenter', () => gsap.to(button, { y: -2, duration: .18, ease: 'power2.out', overwrite: 'auto' }));
        button.addEventListener('pointerleave', () => gsap.to(button, { y: 0, duration: .22, ease: 'power2.out', overwrite: 'auto' }));
        button.addEventListener('pointerdown', () => gsap.to(button, { scale: .97, duration: .1, overwrite: 'auto' }));
        button.addEventListener('pointerup', () => gsap.to(button, { scale: 1, duration: .2, ease: 'back.out(1.4)', overwrite: 'auto' }));
      });
    });

    (function () {
      const path = window.location.pathname.replace(/\/$/, '') || '/';
      const links = Array.from(document.querySelectorAll('.sidebar-section a'));
      const active = links
        .filter(function (link) {
          const href = (link.getAttribute('href') || '').replace(/\/$/, '') || '/';
          return path === href || (href !== '/' && path.startsWith(href + '/'));
        })
        .sort(function (a, b) { return b.getAttribute('href').length - a.getAttribute('href').length; })[0];
      if (active) {
        active.classList.add('active');
        active.setAttribute('aria-current', 'page');
      }
    })();
  </script>
</body>

</html>
