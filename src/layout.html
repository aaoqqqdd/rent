<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#172331" />
  <meta name="color-scheme" content="light" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/styles.css">

</head>

<body class="{{BODY_CLASS}}">
  <div class="page">
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="page-transition-curtain initial-load-curtain" aria-hidden="false" role="status" aria-label="正在加载工作台"><div class="initial-load-screen"><div class="initial-load-mark">PR</div><div class="initial-load-brand">PC RENTAL<span>ASSET OPS / MEL</span></div><div class="initial-load-progress"><i></i></div><div class="initial-load-status">正在载入工作台 <b>01</b></div></div></div>
    <header class="desktop-header">
      <a href="/" class="logo"><span class="logo-mark">PR</span><span class="logo-copy">PC
          Rental<small>设备租赁控制台</small></span></a>
      <span class="asset-tag mono">ASSET OPS / MEL</span>
      <nav class="main-nav">{{TOP_NAV}}</nav>
      <div class="user-block">{{USER_BLOCK}}</div>
    </header>
    <header class="mobile-header">
      {{MOBILE_NAV_TOGGLE}}
      <a href="/" class="logo"><span class="logo-mark">PR</span><span class="logo-copy">PC Rental</span></a>
      <span class="mobile-header__label">{{MOBILE_LABEL}}</span>
      <div class="user-block">{{MOBILE_USER_BLOCK}}</div>
    </header>
    <div class="mobile-nav-scrim" aria-hidden="true"></div>
    <div class="container">
      {{SIDEBAR}}
      <main class="content" id="main-content" tabindex="-1">{{CONTENT}}</main>
    </div>
    <nav class="mobile-bottom-nav" aria-label="移动端导航">{{MOBILE_NAV}}</nav>
    <aside class="notification-drawer" id="notification-drawer" aria-hidden="true"><div class="notification-drawer__head"><div><span class="section-code">INBOX</span><h2>通知中心</h2></div><button type="button" class="notification-drawer__close" aria-label="关闭通知">×</button></div><div class="notification-drawer__body" id="notification-drawer-body"><p class="empty-state">正在加载通知…</p></div><a class="button button-primary notification-drawer__all" href="/notifications">查看全部通知</a></aside>
    {{FOOTER}}
  </div>
  <script src="{{APP_SCRIPT}}" defer></script>
</body>

</html>
